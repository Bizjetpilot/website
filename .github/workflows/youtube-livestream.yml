name: BizJet Pilot YouTube Livestream

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bizjetpilot-homepage/bizjetpilot-homepage/content/streams/**'

jobs:
  check-livestream:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YouTube libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib
      - name: Confirm workflow is running
        run: echo "BizJet Pilot livestream workflow triggered successfully."
      - name: Test livestream announcements
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python scripts/schedule_youtube.py
