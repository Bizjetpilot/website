name: BizJet Pilot YouTube Livestream

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bizjetpilot-homepage/bizjetpilot-homepage/content/streams/**'

jobs:
  check-livestream:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website files
