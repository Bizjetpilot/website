media:
  input: assets
  output: /assets
content:
  - name: news
    label: News
    type: collection
    path: content/news
    format: json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: status, label: Status, type: select, options: { values: [draft, published] } }
      - { name: date, label: Date, type: date }
      - { name: category, label: Category, type: string }
      - { name: simulator, label: Simulator, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: body, label: Article, type: text }
      - { name: youtube_url, label: YouTube URL, type: string }
  - name: reviews
    label: Reviews
    type: collection
    path: content/reviews
    format: json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: status, label: Status, type: select, options: { values: [draft, published] } }
      - { name: date, label: Date, type: date }
      - { name: category, label: Category, type: string }
      - { name: simulator, label: Simulator, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: body, label: Review, type: text }
      - { name: youtube_url, label: YouTube URL, type: string }
  - name: tutorials
    label: Tutorials
    type: collection
    path: content/tutorials
    format: json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: status, label: Status, type: select, options: { values: [draft, published] } }
      - { name: date, label: Date, type: date }
      - { name: category, label: Category, type: string }
      - { name: simulator, label: Simulator, type: string }
      - { name: summary, label: Summary, type: text }
      - { name: body, label: Tutorial, type: text }
      - { name: youtube_url, label: YouTube URL, type: string }
  - name: streams
    label: Live Streams
    type: collection
    path: content/streams
    format: json
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: status, label: Status, type: select, options: { values: [draft, published] } }
      - { name: date, label: Date, type: date }
      - { name: time_utc, label: Time (UTC), type: string }
      - { name: category, label: Category, type: string }
      - { name: from, label: Departure airport, type: string }
      - { name: to, label: Destination airport, type: string }
      - { name: aircraft, label: Aircraft, type: string }
      - { name: simulator, label: Simulator, type: string }
      - { name: summary, label: Description, type: text }
      - { name: youtube_url, label: YouTube URL, type: string }
      - { name: twitch_url, label: Twitch URL, type: string }
